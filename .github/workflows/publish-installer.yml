name: Publish Lumoz setup

on:
  push:
    tags:
      - 'lumoz-setup-v*'

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/validate.yml

  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path('installer/pyproject.toml').read_text())['project']['version']
          if os.environ['RELEASE_TAG'] != f'lumoz-setup-v{version}':
              raise SystemExit('Release tag must match installer/pyproject.toml version')
          PY

  publish:
    needs: [checks, version]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/lumoz-setup/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lumoz-setup
          path: dist/installer
      - name: Publish installer to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/installer

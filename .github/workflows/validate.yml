name: Validate packages

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  secrets:
    name: Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned Gitleaks binary
        env:
          GITLEAKS_VERSION: '8.30.1'
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl --fail --silent --show-error --location "$base/$archive" --output "$RUNNER_TEMP/$archive"
          curl --fail --silent --show-error --location "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" --output "$RUNNER_TEMP/checksums.txt"
          cd "$RUNNER_TEMP"
          grep " $archive\$" checksums.txt | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan all fetched history
        run: gitleaks git --redact --no-banner --log-opts="--all"

  package:
    needs: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check generated manifests
        run: |
          python3 scripts/build_claude.py --check
          python3 scripts/build_mcpb.py --check
          python3 scripts/build_installer.py --check
      - name: Validate portable plugin schemas
        run: |
          python3 -m pip install jsonschema==4.25.1
          python3 scripts/validate_portable.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install tested plugin clients
        run: npm install --global @anthropic-ai/claude-code@2.1.302 @openai/codex@0.163.0
      - name: Check packaging and Codex installation
        run: python3 -m unittest discover -s tests -v
      - name: Validate Claude marketplace and plugins
        run: |
          claude plugin validate . --strict
          claude plugin validate plugins/lumoz-skills --strict
          claude plugin validate plugins/lumoz-mcp --strict
      - name: Build plugin trial ZIPs
        run: python3 scripts/build_claude.py --zip
      - name: Check ZIP integrity
        run: |
          python3 -m zipfile --test dist/lumoz-skills-*.zip
          python3 -m zipfile --test dist/lumoz-mcp-*.zip
      - name: Build and validate Desktop extension
        run: |
          python3 scripts/build_mcpb.py
          npx --yes @anthropic-ai/mcpb@2.1.2 validate mcpb/manifest.json
          python3 -m zipfile --test dist/lumoz.mcpb
      - uses: actions/upload-artifact@v4
        with:
          name: lumoz-plugins
          path: dist/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: lumoz-desktop-extension
          path: dist/*.mcpb
          if-no-files-found: error

  installer:
    needs: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install tested clients and build tools
        run: |
          npm install --global @anthropic-ai/claude-code@2.1.304 @openai/codex@0.163.0
          python -m pip install build
      - name: Check installer defaults
        run: python scripts/build_installer.py --check
      - name: Test isolated client setup
        run: python -m unittest discover -s tests -p test_installer.py -v
      - name: Build installer sdist and wheel
        run: |
          python -m build installer --outdir dist/installer
          python scripts/check_installer.py
      - uses: actions/upload-artifact@v4
        with:
          name: lumoz-setup
          path: dist/installer/*
          if-no-files-found: error
